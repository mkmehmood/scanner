name: Android APK

# Every commit to main builds the app and refreshes ONE rolling release (tag: latest).
# The APK is signed with the release key from the repository secrets, so each new build
# installs over the previous one without uninstalling.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Set version (the run number only ever goes up, so updates install over old builds)
        shell: bash
        run: |
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          { grep -E '^e: ' build.log; awk '/What went wrong/{c=6} c-->0' build.log; } \
            | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -10 \
            | while IFS= read -r l; do echo "::error::${l//%/%25}"; done

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TobaccoScanner-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/TobaccoScanner-debug.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner" verify --print-certs dist/TobaccoScanner-release.apk | head -3

      - name: Upload APKs (workflow run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TobaccoScanner-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Refresh the rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build (v${VERSION_NAME})" \
            --notes "Built automatically from commit ${GITHUB_SHA::7} on main. Install TobaccoScanner-release.apk; it updates over the previous build." \
            --latest
